name: Utopia Labs
description: 'Utopia Labs was a crypto payments startup ("the premier stablecoin studio")
  that spent three years building onchain payments products — including the Tori wallet
  and Offramps.eth, plus consumer USD-to-crypto on/off-ramp tools for paying friends
  and family. It was surfaced in the API Evangelist network as a portfolio company of
  kindred-ventures. The cofounders (Kaito, Jason, and Alex) announced they were joining
  Coinbase, and both Tori and Offramps.eth were shut down as of November 13, 2024. The
  utopialabs.com domain still resolves but the website has been removed (HTTP 404);
  the company exposes no public API, developer portal, or documentation surface. This
  profile is retained as a historical company record.'
